<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPU Scheduler</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --card: #1a1a26;
      --border: rgba(255, 255, 255, 0.07);
      --border-bright: rgba(255, 255, 255, 0.15);
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --accent3: #ff6b6b;
      --amber: #ffc94a;
      --text: #f0f0f8;
      --muted: #7a7a9a;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --p-colors: #6c63ff, #00d4aa, #ff6b6b, #ffc94a, #ff8cc8, #4fc3f7, #a5d6a7, #ffab91;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Noise overlay ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ─── Grid lines ─── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(108, 99, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 99, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      position: relative;
      z-index: 1;
    }

    /* ─── Header ─── */
    header {
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
    }

    .header-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(108, 99, 255, 0.4);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(108, 99, 255, 0);
      }
    }

    h1 {
      font-family: var(--mono);
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    h1 span {
      color: var(--accent2);
    }

    .tagline {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--mono);
    }

    .badge {
      background: rgba(108, 99, 255, 0.12);
      border: 1px solid rgba(108, 99, 255, 0.3);
      color: #a59fff;
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* ─── Layout ─── */
    .main-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 820px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ─── Cards ─── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .card-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '//';
      color: var(--accent);
    }

    /* ─── Process input ─── */
    #proc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

   .proc-row {
  display: grid;
  grid-template-columns: 48px 1fr 1fr 1fr 32px; /* Added an extra 1fr */
  gap: 8px;
  align-items: center;
  animation: fadeIn 0.25s ease;
}

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .proc-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-align: center;
    }

    .proc-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-bright);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .proc-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
    }

    .proc-input::placeholder {
      color: var(--muted);
    }

    .col-label {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 4px;
    }

    .col-headers {
  display: grid;
  grid-template-columns: 48px 1fr 1fr 1fr 32px; /* Added an extra 1fr */
  gap: 8px;
  margin-bottom: 4px;
}

    .del-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.25);
      color: var(--accent3);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .del-btn:hover {
      background: rgba(255, 107, 107, 0.25);
    }

    /* ─── Buttons ─── */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      border: 1px solid;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .btn-add {
      background: rgba(0, 212, 170, 0.08);
      border-color: rgba(0, 212, 170, 0.3);
      color: var(--accent2);
    }

    .btn-add:hover {
      background: rgba(0, 212, 170, 0.18);
    }

    .btn-run {
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.2), rgba(108, 99, 255, 0.08));
      border-color: var(--accent);
      color: #c4bfff;
      position: relative;
      overflow: hidden;
    }

    .btn-run::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.3), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn-run:hover::after {
      opacity: 1;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--border-bright);
      color: var(--muted);
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
    }

    /* ─── Right panel ─── */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ─── Animation Stage ─── */
    #anim-stage {
      min-height: 240px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .stage-idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
    }

    .stage-idle svg {
      opacity: 0.2;
    }

    .cpu-vis {
      width: 100%;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cpu-timeline {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    .cpu-block {
      height: 52px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }

    .cpu-block.active {
      animation: block-pulse 0.6s ease;
      box-shadow: 0 0 0 2px currentColor, 0 0 20px currentColor;
    }

    @keyframes block-pulse {
      0% {
        transform: scaleY(1);
      }

      30% {
        transform: scaleY(1.15);
      }

      100% {
        transform: scaleY(1);
      }
    }

    .cpu-info {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .cpu-stat {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .cpu-stat-label {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .cpu-stat-value {
      font-size: 20px;
      font-weight: 600;
      font-family: var(--mono);
    }

    .clock-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .clock-track {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .clock-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.4s ease;
    }

    .queue-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .queue-chip {
      padding: 4px 12px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      border: 1px solid;
      transition: all 0.3s;
    }

    .log-line {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
    }

    .log-line span {
      color: var(--accent2);
    }

    .log-line.active-log {
      color: var(--text);
    }

    /* ─── Gantt chart ─── */
    #gantt-wrap {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .gantt-row {
      display: flex;
      align-items: stretch;
      gap: 3px;
      min-height: 56px;
    }

    .g-block {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      min-width: 30px;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: default;
      position: relative;
      flex-shrink: 0;
    }

    .g-block:hover {
      transform: scaleY(1.08);
      z-index: 2;
    }

    .gantt-ticks {
      display: flex;
      position: relative;
      height: 22px;
      margin-top: 3px;
    }

    .g-tick {
      position: absolute;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      transform: translateX(-50%);
    }

    /* ─── Results table ─── */
    .result-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .result-table th {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .result-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .result-table tr:last-child td {
      border-bottom: none;
    }

    .result-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* ─── Metrics ─── */
    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .m-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .m-label {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .m-value {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 700;
    }

    /* ─── Controls ─── */
    .anim-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .ctrl-btn {
      padding: 7px 14px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-bright);
      color: var(--text);
      transition: all 0.15s;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .ctrl-btn.active {
      background: rgba(108, 99, 255, 0.2);
      border-color: var(--accent);
      color: #c4bfff;
    }

    .speed-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    select.ctrl-btn {
      padding: 7px 10px;
      cursor: pointer;
    }

    .section-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      display: inline-block;
      margin-right: 6px;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header>
      <div class="header-inner">
        <div class="logo-group">
          <div class="logo-icon">CPU</div>
          <div>
            <h1>CPU <span>Simulator</span></h1>
            <div class="tagline">First Come · First Served · CPU Simulation</div>
          </div>
        </div>
        <div class="badge">DAA Project // C++</div>
      </div>
    </header>

    <!-- MAIN -->
    <div class="main-grid">

      <!-- LEFT: Input -->
      <div class="card">
        <div class="card-title">Process Input</div>
        <!-- Algorithm Selector -->
        <div style="margin-bottom: 1.5rem;">
          <label class="col-label" style="display:block; text-align:left; margin-bottom: 8px;">ALGORITHM</label>
          <select id="algo-select" class="proc-input" style="margin-bottom: 10px; cursor: pointer;" onchange="toggleQuantum()">
            <option value="1">FCFS (First Come First Served)</option>
            <option value="2">SJF (Non-Preemptive)</option>
            <option value="3">SRTF (SJF Preemptive)</option>
            <option value="4">Priority (Non-Preemptive)</option>
            <option value="5">Priority (Preemptive)</option>
            <option value="6">Round Robin</option>
          </select>
          
          <!-- Hidden by default, only shows for Round Robin -->
          <div id="quantum-container" class="hidden">
            <label class="col-label" style="display:block; text-align:left; margin-bottom: 8px;">TIME QUANTUM</label>
            <input type="number" id="time-quantum" class="proc-input" value="2" min="1">
          </div>
        </div>

        <!-- Updated Headers -->
        <div class="col-headers">
          <div></div>
          <div class="col-label">Arrival</div>
          <div class="col-label">Burst</div>
          <div class="col-label">Priority</div>
          <div></div>
        </div>
        <div id="proc-list"></div>
        <div class="btn-group">
          <button class="btn btn-add" onclick="addProcess()">+ Add Process</button>
          <button class="btn btn-run" onclick="runFCFS()">▶️ Run Simulation</button>
          <button class="btn btn-reset" onclick="resetAll()">↺ Reset</button>
        </div>
      </div>

      <!-- RIGHT: Output -->
      <div class="right-panel">

        <!-- Animation Stage -->
        <div class="card">
          <div class="section-row">
            <div class="card-title" style="margin-bottom:0">Live Simulation</div>
            <div class="anim-controls" id="anim-controls" style="display:none">
              <button class="ctrl-btn" id="play-btn" onclick="togglePlay()">▶️ Play</button>
              <button class="ctrl-btn" onclick="stepBack()">‹</button>
              <button class="ctrl-btn" onclick="stepForward()">›</button>
              <span class="speed-label">Speed:</span>
              <select class="ctrl-btn" id="speed-sel" onchange="updateSpeed()">
                <option value="1200">Slow</option>
                <option value="700" selected>Normal</option>
                <option value="300">Fast</option>
              </select>
            </div>
          </div>

          <div id="anim-stage">
            <div class="stage-idle">
              <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                <rect x="8" y="20" width="48" height="28" rx="6" stroke="white" stroke-width="2" />
                <rect x="24" y="48" width="16" height="6" stroke="white" stroke-width="2" />
                <rect x="16" y="54" width="32" height="2" rx="1" fill="white" />
                <rect x="14" y="26" width="10" height="16" rx="2" fill="white" opacity="0.3" />
                <rect x="27" y="26" width="10" height="16" rx="2" fill="white" opacity="0.3" />
                <rect x="40" y="26" width="10" height="16" rx="2" fill="white" opacity="0.3" />
              </svg>
              <span>Configure processes and click Run Simulation</span>
            </div>
          </div>
        </div>

        <!-- Log -->
        <div class="card hidden" id="log-card">
          <div class="card-title">
            <span class="status-dot" id="log-dot"></span>Execution Log
          </div>
          <div id="log-box" style="max-height:140px;overflow-y:auto;"></div>
        </div>

        <!-- Gantt Chart -->
        <div class="card hidden" id="gantt-card">
          <div class="card-title">Gantt Chart</div>
          <div id="gantt-wrap">
            <div class="gantt-row" id="gantt-row"></div>
            <div class="gantt-ticks" id="gantt-ticks"></div>
          </div>
        </div>

        <!-- Metrics -->
        <div class="card hidden" id="metrics-card">
          <div class="card-title">Performance Metrics</div>
          <div class="metrics-row" id="metrics-row"></div>
        </div>

        <!-- Results Table -->
        <div class="card hidden" id="results-card">
          <div class="card-title">Results Table</div>
          <div style="overflow-x:auto">
            <table class="result-table" id="result-table"></table>
          </div>
        </div>

      </div>
    </div>

    <div style="height:4rem"></div>
  </div>

  <script>
    const PCOLORS = [
      { bg: 'rgba(108,99,255,0.18)', border: 'rgba(108,99,255,0.6)', text: '#a59fff' },
      { bg: 'rgba(0,212,170,0.15)', border: 'rgba(0,212,170,0.6)', text: '#00d4aa' },
      { bg: 'rgba(255,107,107,0.15)', border: 'rgba(255,107,107,0.6)', text: '#ff8080' },
      { bg: 'rgba(255,201,74,0.15)', border: 'rgba(255,201,74,0.6)', text: '#ffc94a' },
      { bg: 'rgba(255,140,200,0.15)', border: 'rgba(255,140,200,0.6)', text: '#ff8cc8' },
      { bg: 'rgba(79,195,247,0.15)', border: 'rgba(79,195,247,0.6)', text: '#4fc3f7' },
      { bg: 'rgba(165,214,167,0.15)', border: 'rgba(165,214,167,0.6)', text: '#a5d6a7' },
      { bg: 'rgba(255,171,145,0.15)', border: 'rgba(255,171,145,0.6)', text: '#ffab91' },
    ];
    const IDLE_C = { bg: 'rgba(255,255,255,0.04)', border: 'rgba(255,255,255,0.12)', text: '#555575' };

    let processes = [], pidCtr = 1;
    let animSteps = [], stepIdx = -1, playTimer = null, isPlaying = false;
    let animSpeed = 700;

    function pcolor(pid) { return PCOLORS[(pid - 1) % PCOLORS.length]; }

    function addProcess(arr = '', burst = '', priority = 1) {
      const pid = pidCtr++;
      processes.push({ pid, arr, burst, priority }); // Added priority here
      renderList();
    }

    function removeProcess(pid) {
      processes = processes.filter(p => p.pid !== pid);
      renderList();
    }

    function renderList() {
      const el = document.getElementById('proc-list');
      el.innerHTML = '';
      processes.forEach(p => {
        const c = pcolor(p.pid);
        const row = document.createElement('div');
        row.className = 'proc-row';
        row.innerHTML = `
      <div class="proc-label" style="background:${c.bg};color:${c.text};border:1px solid ${c.border}">P${p.pid}</div>
      <input class="proc-input" type="number" min="0" placeholder="0" value="${p.arr}" id="arr-${p.pid}" />
      <input class="proc-input" type="number" min="1" placeholder="1" value="${p.burst}" id="burst-${p.pid}" />
      <input class="proc-input" type="number" min="1" placeholder="1" value="${p.priority || 1}" id="prio-${p.pid}" />
      <button class="del-btn" onclick="removeProcess(${p.pid})">×</button>
    `;
        el.appendChild(row);
      });
    }

    function collect() {
      return processes.map(p => ({
        pid: p.pid,
        arrival: Math.max(0, parseInt(document.getElementById('arr-' + p.pid).value) || 0),
        burst: Math.max(1, parseInt(document.getElementById('burst-' + p.pid).value) || 1),
        priority: Math.max(1, parseInt(document.getElementById('prio-' + p.pid).value) || 1), // Grab priority from UI
        remaining: 0, start: -1, completion: 0, tat: 0, wt: 0
      }));
    }

    async function runFCFS() {
  const processes = collect();
  if (processes.length === 0) return alert("Add processes first");

  // 1. Format input string for the C++ binary
  let input = processes.length + "\n";
  processes.forEach(p => {
    input += `${p.arrival} ${p.burst} ${p.priority}\n`; // Send actual priority!
  });

  // 2. Grab the selected algorithm
  const algoChoice = document.getElementById('algo-select').value;
  input += algoChoice + "\n";

  // 3. If Round Robin (Choice 6), we MUST send the time quantum too
  if (algoChoice === "6") {
    const quantum = document.getElementById('time-quantum').value;
    input += quantum + "\n";
  }

  try {
    const res = await fetch("https://schedulix-simulator.onrender.com/schedule", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input })
    });

    if (!res.ok) throw new Error("Backend connection failed");
    
    const data = await res.json();

    // --- CLEAN THE OUTPUT ---
    const cleanText = data.output.replace(/\x1b\[[0-9;]*m/g, '');
    const lines = cleanText.split('\n');

    // --- PARSE THE TEXT INTO ARRAYS ---
    let isGantt = false, isTable = false;
    const gantt = [], results = [];

    for (let line of lines) {
      if (line.includes('Gantt Chart')) { isGantt = true; isTable = false; continue; }
      if (line.includes('Process Execution Table')) { isGantt = false; isTable = true; continue; }
      if (line.startsWith('+')) continue;

      // Parse Gantt Chart rows
      if (isGantt && line.startsWith('|')) {
        const parts = line.split('|').map(s => s.trim()).filter(s => s);
        if (parts.length === 3 && parts[0] !== 'Process') { 
          const proc = parts[0];
          gantt.push({
            pid: proc === 'IDLE' ? null : parseInt(proc.replace('P', '')),
            idle: proc === 'IDLE',
            label: proc,
            start: parseInt(parts[1]),
            end: parseInt(parts[2])
          });
        }
      }

      // Parse Results Table rows
      if (isTable && line.startsWith('|')) {
        const parts = line.split('|').map(s => s.trim()).filter(s => s);
        if (parts.length === 7 && parts[0] !== 'PID') { 
          results.push({
            pid: parseInt(parts[0]),
            arrival: parseInt(parts[1]),
            burst: parseInt(parts[2]),
            priority: parseInt(parts[3]), // <-- We now grab Priority from the C++ table!
            completion: parseInt(parts[4]),
            tat: parseInt(parts[5]),
            wt: parseInt(parts[6]),
            // For preemptive algorithms, Start time varies, but we'll use the first Gantt appearance in the render function later if needed
            start: parseInt(parts[1]) + parseInt(parts[6]) 
          });
        }
      }
    }

    // --- UPDATE THE UI ---
    ['gantt-card', 'metrics-card', 'results-card', 'log-card'].forEach(id => {
      document.getElementById(id).classList.remove('hidden');
    });
    document.getElementById('anim-controls').style.display = 'flex';
    document.getElementById('log-box').innerHTML = '';

    const sortedProcs = processes.slice().sort((a, b) => a.arrival - b.arrival);
    renderGantt(gantt);
    renderResults(results);
    buildAnimSteps(gantt, sortedProcs, results);
    
    stepIdx = -1;
    showStep(0);

  } catch (err) {
    console.error("Fetch Error:", err);
    alert("Could not connect to backend. Is it awake?");
  }
}
    function buildAnimSteps(gantt, sorted, results) {
      animSteps = [];
      const total = gantt[gantt.length - 1].end;

      gantt.forEach((block, i) => {
        const queue = sorted.filter(p => p.arrival <= block.start && (p.start >= block.start || p.pid === block.pid));
        animSteps.push({ block, blockIdx: i, gantt, time: block.end, queue, results, total });
      });
    }

    function showStep(idx) {
      if (idx < 0 || idx >= animSteps.length) return;
      stepIdx = idx;
      const step = animSteps[idx];
      renderSimStage(step);
      highlightGantt(step.blockIdx);
      appendLog(step);
    }

    function renderSimStage(step) {
      const { block, gantt, time, total } = step;
      const stage = document.getElementById('anim-stage');

      const progress = (time / total) * 100;
      const c = block.idle ? IDLE_C : pcolor(block.pid);
      const runningLabel = block.idle ? 'IDLE' : `P${block.pid}`;
      const burstLeft = block.idle ? '—' : (block.end - block.start);

      // Build mini timeline
      let tlHTML = '';
      gantt.forEach((b, i) => {
        const dur = b.end - b.start;
        const pct = (dur / total) * 100;
        const bc = b.idle ? IDLE_C : pcolor(b.pid);
        const isActive = i === step.blockIdx;
        tlHTML += `<div class="cpu-block${isActive ? ' active' : ''}" 
      style="width:${pct}%;background:${bc.bg};border:1px solid ${bc.border};color:${bc.text};
             ${isActive ? `box-shadow:0 0 0 2px ${bc.border}, 0 0 18px ${bc.bg};transform:scaleY(1.12)` : ''}"
    >${b.label}</div>`;
      });

      // Queue chips
      const arrived = gantt.filter((b, i) => i > step.blockIdx && !b.idle);
      let qHTML = '';
      if (arrived.length) {
        arrived.forEach(b => {
          const bc = pcolor(b.pid);
          qHTML += `<div class="queue-chip" style="background:${bc.bg};border-color:${bc.border};color:${bc.text};">${b.label}</div>`;
        });
      } else {
        qHTML = `<span style="color:var(--muted);font-size:11px;font-family:var(--mono)">— empty —</span>`;
      }

      stage.innerHTML = `<div class="cpu-vis">
    <div class="clock-bar">
      <span>t = ${time}</span>
      <div class="clock-track"><div class="clock-fill" style="width:${progress.toFixed(1)}%"></div></div>
      <span>${total}</span>
    </div>
    <div class="cpu-timeline">${tlHTML}</div>
    <div class="cpu-info">
      <div class="cpu-stat">
        <div class="cpu-stat-label">Running</div>
        <div class="cpu-stat-value" style="color:${c.text}">${runningLabel}</div>
      </div>
      <div class="cpu-stat">
        <div class="cpu-stat-label">Time Slice</div>
        <div class="cpu-stat-value" style="color:${c.text}">${burstLeft}</div>
      </div>
      <div class="cpu-stat">
        <div class="cpu-stat-label">Clock</div>
        <div class="cpu-stat-value" style="color:var(--accent2)">${block.start}→${block.end}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.08em">READY QUEUE:</span>
      <div class="queue-row">${qHTML}</div>
    </div>
  </div>`;
    }

    function appendLog(step) {
      const { block } = step;
      const box = document.getElementById('log-box');
      const div = document.createElement('div');
      div.className = 'log-line active-log';
      if (block.idle) {
        div.innerHTML = `t=${block.start}–${block.end} &nbsp; CPU <span>IDLE</span> — waiting for next arrival`;
      } else {
        const c = pcolor(block.pid);
        div.innerHTML = `t=${block.start}–${block.end} &nbsp; <span style="color:${c.text}">P${block.pid}</span> executing &nbsp; | &nbsp; burst=${block.end - block.start}`;
      }
      box.insertBefore(div, box.firstChild);
      // Dim older logs
      Array.from(box.children).forEach((el, i) => {
        el.style.opacity = i === 0 ? '1' : Math.max(0.25, 1 - i * 0.18).toFixed(2);
        el.classList.toggle('active-log', i === 0);
      });
    }

    function renderGantt(gantt) {
      const total = gantt[gantt.length - 1].end - gantt[0].start;
      const row = document.getElementById('gantt-row');
      const ticks = document.getElementById('gantt-ticks');
      row.innerHTML = ''; ticks.innerHTML = '';

      gantt.forEach((block, i) => {
        const dur = block.end - block.start;
        const pct = (dur / total) * 100;
        const c = block.idle ? IDLE_C : pcolor(block.pid);
        const div = document.createElement('div');
        div.className = 'g-block';
        div.id = 'gb-' + i;
        div.style.cssText = `width:${pct}%;background:${c.bg};border:1px solid ${c.border};color:${c.text}`;
        div.title = `${block.label}: t=${block.start}–${block.end}`;
        div.textContent = block.label;
        row.appendChild(div);
      });

      const allT = [...new Set(gantt.map(b => b.start).concat(gantt[gantt.length - 1].end))];
      allT.forEach(t => {
        const pct = ((t - gantt[0].start) / total) * 100;
        const tick = document.createElement('span');
        tick.className = 'g-tick'; tick.style.left = pct + '%'; tick.textContent = t;
        ticks.appendChild(tick);
      });
    }

    function highlightGantt(activeIdx) {
      document.querySelectorAll('.g-block').forEach((el, i) => {
        el.style.opacity = i <= activeIdx ? '1' : '0.2';
        if (i === activeIdx) {
          el.style.boxShadow = `0 0 0 2px currentColor, 0 0 16px rgba(255,255,255,0.1)`;
          el.style.transform = 'scaleY(1.1)';
        } else {
          el.style.boxShadow = '';
          el.style.transform = '';
        }
      });
    }

    function renderResults(results) {
      results.sort((a, b) => a.pid - b.pid);
      const avgWT = results.reduce((s, r) => s + r.wt, 0) / results.length;
      const avgTAT = results.reduce((s, r) => s + r.tat, 0) / results.length;
      const maxTAT = Math.max(...results.map(r => r.tat));

      document.getElementById('metrics-row').innerHTML = `
    <div class="m-card">
      <div class="m-label">Avg Waiting Time</div>
      <div class="m-value" style="color:var(--accent)">${avgWT.toFixed(2)}</div>
    </div>
    <div class="m-card">
      <div class="m-label">Avg Turnaround</div>
      <div class="m-value" style="color:var(--accent2)">${avgTAT.toFixed(2)}</div>
    </div>
    <div class="m-card">
      <div class="m-label">Processes</div>
      <div class="m-value" style="color:var(--amber)">${results.length}</div>
    </div>
  `;

      const tbl = document.getElementById('result-table');
      // Added Priority to the Table Headers
      tbl.innerHTML = `<thead><tr>
    <th>PID</th><th>Arrival</th><th>Burst</th><th>Priority</th><th>Start</th>
    <th>Completion</th><th>Turnaround</th><th>Waiting</th>
  </tr></thead>`;
      
      const tbody = document.createElement('tbody');
      results.forEach(r => {
        const c = pcolor(r.pid);
        const tr = document.createElement('tr');
        // Added the Priority cell data
        tr.innerHTML = `
      <td><span class="proc-label" style="background:${c.bg};color:${c.text};border:1px solid ${c.border};padding:3px 10px">P${r.pid}</span></td>
      <td style="color:var(--muted)">${r.arrival}</td>
      <td style="color:var(--muted)">${r.burst}</td>
      <td style="color:#ffc94a; font-weight:bold;">${r.priority}</td>
      <td>${r.start}</td>
      <td style="color:var(--accent2)">${r.completion}</td>
      <td style="color:${r.tat > maxTAT * 0.75 ? 'var(--accent3)' : 'var(--text)'}">${r.tat}</td>
      <td style="color:${r.wt > maxTAT * 0.55 ? 'var(--accent3)' : 'var(--text)'}">${r.wt}</td>
    `;
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
    }

    function startAutoPlay() {
      stopAnim();
      isPlaying = true;
      document.getElementById('play-btn').textContent = '⏸ Pause';
      document.getElementById('play-btn').classList.add('active');
      playTimer = setInterval(() => {
        if (stepIdx + 1 >= animSteps.length) {
          stopAnim();
          document.querySelectorAll('.g-block').forEach(el => { el.style.opacity = '1'; el.style.transform = ''; el.style.boxShadow = ''; });
          document.getElementById('log-dot').style.display = 'none';
          return;
        }
        showStep(stepIdx + 1);
      }, animSpeed);
    }

    function stopAnim() {
      if (playTimer) { clearInterval(playTimer); playTimer = null; }
      isPlaying = false;
      document.getElementById('play-btn').textContent = '▶️ Play';
      document.getElementById('play-btn').classList.remove('active');
    }

    function togglePlay() {
      if (isPlaying) stopAnim();
      else { if (stepIdx >= animSteps.length - 1) { stepIdx = -1; } startAutoPlay(); }
    }

    function stepForward() { stopAnim(); showStep(stepIdx + 1); }
    function stepBack() { stopAnim(); showStep(stepIdx - 1); }
    function updateSpeed() { animSpeed = parseInt(document.getElementById('speed-sel').value); if (isPlaying) { stopAnim(); startAutoPlay(); } }

    function resetAll() {
      stopAnim();
      processes = []; pidCtr = 1; animSteps = []; stepIdx = -1;
      renderList();
      ['gantt-card', 'metrics-card', 'results-card', 'log-card'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('anim-controls').style.display = 'none';
      document.getElementById('anim-stage').innerHTML = `<div class="stage-idle">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
      <rect x="8" y="20" width="48" height="28" rx="6" stroke="white" stroke-width="2"/>
      <rect x="24" y="48" width="16" height="6" stroke="white" stroke-width="2"/>
      <rect x="16" y="54" width="32" height="2" rx="1" fill="white"/>
      <rect x="14" y="26" width="10" height="16" rx="2" fill="white" opacity="0.3"/>
      <rect x="27" y="26" width="10" height="16" rx="2" fill="white" opacity="0.3"/>
      <rect x="40" y="26" width="10" height="16" rx="2" fill="white" opacity="0.3"/>
    </svg>
    <span>Configure processes and click Run Simulation</span>
  </div>`;
    }

    // Seed
    addProcess(0, 6);
    addProcess(1, 4);
    addProcess(2, 3);
    addProcess(4, 5);

  </script>
</body>
